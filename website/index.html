<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModernChat — 插件优先的网页聊天平台</title>
    <meta
      name="description"
      content="开箱只有账号与纯文本聊天，图片、表情、主题、机器人、小游戏全部由可插拔的 JS 插件实现。前后端分离，Go + Vue 3，开源自托管。"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='19' rx='6' fill='%230052d9'/%3E%3Cpath d='M11 24l-3 5 7-5z' fill='%230052d9'/%3E%3Ccircle cx='11' cy='14.5' r='2' fill='%23fff'/%3E%3Ccircle cx='16' cy='14.5' r='2' fill='%23fff'/%3E%3Ccircle cx='21' cy='14.5' r='2' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // 首屏防闪烁：与主站共用 mc_theme，在任何样式生效前先定好主题
      ;(function () {
        try {
          var saved = localStorage.getItem('mc_theme') || 'auto'
          var dark =
            saved === 'dark' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('theme-mode', dark ? 'dark' : 'light')
        } catch (e) {
          /* 隐私模式：保持默认 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
