<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ModernChat — 插件优先的网页聊天平台</title>
    <meta
      name="description"
      content="开箱只有账号与纯文本聊天，图片、表情、主题、机器人、小游戏全部由可插拔的 JS 插件实现。前后端分离，Go + Vue 3，开源自托管。"
    />
    <!-- 与产品站（web/）使用同一枚图标：web/public/favicon.ico 的副本 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- 移动端地址栏配色随主题切换（与产品站一致） -->
    <meta name="theme-color" content="#0052d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)" />
    <script>
      // 首屏防闪烁：与主站共用 mc_theme，在任何样式生效前先定好主题
      ;(function () {
        try {
          var saved = localStorage.getItem('mc_theme') || 'auto'
          var dark =
            saved === 'dark' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('theme-mode', dark ? 'dark' : 'light')
        } catch (e) {
          /* 隐私模式：保持默认 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
