# ModernChat 本地一键环境（MySQL + 后端）
#
#   docker compose up -d --build     # 起 MySQL 与后端（:8080）
#   cd web && npm run dev            # 前端 :5173（代理到 8080）
#
# 说明：
# - 首次启动 MIGRATE=true 会执行 server/migrations 建表
# - JWT_SECRET 请换成自己的随机串（openssl rand -hex 32）
# - 前端已构建时，可把 web/dist 挂到 nginx 容器，见文末注释
# - 版本注入：VERSION / COMMIT / BUILD_TIME 作为 build args 传给 server/Dockerfile，
#   未设置时回退 dev / unknown（构建上下文没有 .git 也不影响构建）。构建机有 git 时：
#     VERSION=$(git describe --tags --always) COMMIT=$(git rev-parse --short HEAD) \
#     BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) docker compose up -d --build
#   核对：curl http://127.0.0.1:8080/api/version
# - 镜像源可配置：GO_IMAGE / RUNTIME_IMAGE / GOPROXY / APK_MIRROR 透传给 Dockerfile，
#   默认均为官方源；国内网络用法见 README

services:
  mysql:
    image: mysql:8.0
    container_name: modernchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: modernchat
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build:
      context: ./server
      args:
        # 构建上下文没有 .git：版本由环境变量传入，未设置时回退 dev / unknown
        VERSION: "${VERSION:-dev}"
        COMMIT: "${COMMIT:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
        # 镜像源：默认官方源，可按网络环境覆盖
        GO_IMAGE: "${GO_IMAGE:-golang:1.26-alpine}"
        RUNTIME_IMAGE: "${RUNTIME_IMAGE:-alpine:3.20}"
        GOPROXY: "${GOPROXY:-https://proxy.golang.org,direct}"
        APK_MIRROR: "${APK_MIRROR:-dl-cdn.alpinelinux.org}"
    container_name: modernchat-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "8080"
      GIN_MODE: release
      DB_DSN: "root:root@tcp(mysql:3306)/modernchat?charset=utf8mb4&parseTime=True&loc=Local"
      JWT_SECRET: "dev-only-secret-please-change-32-bytes-min"
      LOG_LEVEL: info
      MIGRATE: "true"
      FRONTEND_URL: "http://localhost:5173"
    ports:
      - "8080:8080"

volumes:
  mysql-data:

