<!DOCTYPE html>
<html lang="zh-CN" theme-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端地址栏配色随主题切换 -->
    <meta name="theme-color" content="#0052d9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)" />
    <title>ModernChat</title>
    <script>
      // 首屏防闪烁：在样式生效前应用已保存的主题与认证页背景色
      ;(function () {
        try {
          var saved = localStorage.getItem('mc_theme') || 'auto'
          var dark =
            saved === 'dark' ||
            (saved === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('theme-mode', dark ? 'dark' : 'light')

          var scene = localStorage.getItem('mc_scene_color')
          if (scene && /^#[0-9a-fA-F]{6}$/.test(scene)) {
            document.documentElement.style.setProperty('--mc-scene-color', scene)
          }

          // 全站背景（颜色 / 纹理 / 图片）由 Pinia prefs.init() 在挂载前生成 CSS 变量
        } catch (e) {
          /* 隐私模式下 localStorage 不可用：保持默认 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
