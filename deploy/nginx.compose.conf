# docker compose 版前端容器配置（静态文件挂载 /usr/share/nginx/html）
# 与 nginx.conf.example 的区别：后端地址用 compose 服务名 server:8080

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== 安全响应头（API 响应头由后端中间件负责）=====
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # CSP 默认不启用：插件沙箱靠 iframe srcdoc + 内联脚本，严格 CSP 会让插件系统失效。
    # 启用前请先把插件改为外链沙箱页，并保留 'unsafe-inline'。

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
    }

    location /ws {
        # token 只能走 query（浏览器 WS 不能自定义头），默认日志会记录完整 URI
        # 从而留下可用令牌 —— 关闭该路径的访问日志（CWE-598）。
        access_log off;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
